name: CCC mailbox poller

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccc-mailbox-poller
  cancel-in-progress: false

jobs:
  poll-mailbox:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install worker dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Write temporary OAuth files
        env:
          GMAIL_CLIENT_SECRET_JSON: ${{ secrets.GMAIL_CLIENT_SECRET_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          Path("backend/local-credentials.json").write_text(
              os.environ["GMAIL_CLIENT_SECRET_JSON"], encoding="utf-8"
          )
          Path("backend/token.json").write_text(
              os.environ["GMAIL_TOKEN_JSON"], encoding="utf-8"
          )
          PY
      - name: Poll Gmail once
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_MAILBOX: ${{ secrets.GMAIL_MAILBOX }}
          GMAIL_ALLOWED_SENDERS: ${{ secrets.GMAIL_ALLOWED_SENDERS }}
          GMAIL_CLIENT_SECRET_FILE: local-credentials.json
          GMAIL_TOKEN_FILE: token.json
          GMAIL_POLL_SECONDS: "30"
          GMAIL_INITIAL_UID: "0"
          APP_ENV: production
          PYTHONUNBUFFERED: "1"
        run: python worker.py --once
